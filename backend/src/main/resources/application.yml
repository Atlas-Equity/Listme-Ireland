spring:
  application:
    name: listit-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/listit_db
    username: listit_user
    password: listit_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
